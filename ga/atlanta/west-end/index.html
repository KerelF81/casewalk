<title>The Last Order — Casewalk West End</title>

<style>
  :root{
    --paper:#ece2cd;
    --paper-2:#e4d7bd;

  html,body{margin:0;padding:0;}
  body{

      radial-gradient(circle at 85% 92%, rgba(138,37,52,0.08), transparent 45%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);

    line-height:1.55;
  }
  h1,h2,h3{font-family:'Fraunces', serif; color:var(--ink); font-weight:600; margin:0 0 0.4em;}
  h1{font-size:1.9rem;}
  h2{font-size:1.3rem;}
  h3{font-size:1.05rem;}
  p{margin:0 0 1em;}
  a{color:var(--oxblood-deep); text-decoration-thickness:1px;}
  a:hover{color:var(--oxblood);}
  :focus-visible{outline:3px solid var(--brass); outline-offset:2px; border-radius:2px;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 18px 60px;}
  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:22px 0 18px; border-bottom:1px solid rgba(107,93,70,0.25);
    margin-bottom:22px;
  }
  .brandline{font-family:'Special Elite', monospace; letter-spacing:0.14em; font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; margin-bottom:6px;}
  .case-title{font-size:1.6rem; margin-bottom:2px;}
  .case-loc{font-size:0.88rem; color:var(--ink-soft);}
  .seal-col{display:flex; flex-direction:column; align-items:center; gap:8px; flex:0 0 auto;}
  .leg-dots{display:flex; gap:6px;}

  .leg-dot.done{background:var(--oxblood-deep);}
  .leg-dot.current{background:var(--brass);}
  .crack{fill:none; stroke:var(--dusk); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:90; stroke-dashoffset:90; opacity:0; transition:stroke-dashoffset .9s ease, opacity .25s ease;}
  .crack.active{stroke-dashoffset:0; opacity:0.9;}
  @media (prefers-reduced-motion: reduce){ .crack{transition:none;} }

    background:rgba(236,226,205,0.55);
    border:1px solid rgba(181,137,59,0.4);
    border-radius:4px;
    padding:24px 22px;
    margin-bottom:18px;
    box-shadow:0 1px 0 rgba(255,255,255,0.4) inset;

  .suspects{list-style:none; padding:0; margin:0;}

  .suspects li:first-child{border-top:none;}
  .suspects .note{color:var(--ink-soft); font-size:0.92rem;}

  button:hover, .btn:hover{background:var(--oxblood); color:var(--paper);}

  .challenge-row .mark{width:20px; height:20px; border-radius:50%; border:1px solid var(--brass); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:0.7rem;}

  .challenge-row.solved{color:var(--ink);}
  label{display:block; font-weight:600; font-size:0.88rem; margin-bottom:6px;}
  input[type="text"]{
    width:100%; font-size:1rem; padding:12px 12px; border:1px solid var(--ink-soft);
    border-radius:3px; background:#fbf6ec; color:var(--ink); font-family:'Hanken Grotesk', sans-serif;
  }
  form.challenge-form{margin-top:6px;}
  .field-row{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;}
  .field-row input{flex:1 1 200px;}
  .feedback{margin-top:12px; font-size:0.92rem; padding:10px 12px; border-radius:3px; border-left:3px solid var(--brass); background:rgba(181,137,59,0.1);}
  .feedback.correct{border-left-color:var(--oxblood-deep); background:rgba(138,37,52,0.08); color:var(--oxblood-deep); font-weight:600;}
  .feedback.reveal{border-left-color:var(--dusk); background:rgba(35,53,66,0.08);}
  .destination{margin-top:6px;}
  .destination dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:0.94rem; margin:14px 0;}
  .destination dt{color:var(--ink-soft); font-weight:600;}
  .destination dd{margin:0;}
  .actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px;}
  .quiet{font-size:0.85rem; color:var(--ink-soft);}
  .toggle-code{margin-top:14px;}
  .status-msg{font-size:0.9rem; color:var(--ink-soft); margin-top:10px;}

  .startover{position:fixed; bottom:14px; right:14px; font-size:0.75rem; color:var(--ink-soft); background:rgba(236,226,205,0.85); border:1px solid rgba(181,137,59,0.4); border-radius:3px; padding:6px 10px; cursor:pointer;}

  @media (max-width:420px){

    .seal-col{align-self:flex-end;}
  }

function freshState(){
  return {
    screen: "brief", // brief | play | final
    leg: 0,
    stage: "intro", // intro | quiz | unlocked
    solved: LEGS.map(function(l){ return l.challenges.map(function(){ return false; }); }),
    attempts: LEGS.map(function(l){ return l.challenges.map(function(){ return 0; }); }),
    arrived: LEGS.map(function(){ return false; })
  };
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.solved || parsed.solved.length !== LEGS.length) return freshState();
    return parsed;
  }catch(e){ return freshState(); }
}

  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}

  var R = 6371000;
  function toRad(d){ return d * Math.PI / 180; }
  var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) * Math.sin(dLng/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}
function logPing(locationId, label, verifiedBy){
  try{
    fetch(CASE.logging_endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ locationId: locationId, label: label, verifiedBy: verifiedBy, ts: new Date().toISOString() }),
      keepalive: true
    }).catch(function(){});
  }catch(e){}
}
function updateSeal(){
  for(var i=0;i<3;i++){
    var el = document.getElementById("crack" + i);
    if(!el) continue;
    var done = state.arrived[i] || (state.solved[i] && state.solved[i].every(Boolean) && (i < state.leg || state.screen === "final"));
    if(state.solved[i] && state.solved[i].every(Boolean)) el.classList.add("active");
    else el.classList.remove("active");
  }
  var dotsWrap = document.getElementById("legDots");
  dotsWrap.innerHTML = "";
  for(var j=0;j<LEGS.length;j++){
    var dot = document.createElement("span");
    var cls = "leg-dot";
    if(state.arrived[j]) cls += " done";
    else if(j === state.leg && state.screen === "play") cls += " current";
    dot.className = cls;
    dotsWrap.appendChild(dot);
  }
}

// ---------- rendering ----------
function render(){
  updateSeal();
  if(state.screen === "brief"){ renderBrief(); return; }
  if(state.screen === "final"){ renderFinal(); return; }
  var leg = LEGS[state.leg];
  if(state.stage === "intro"){ renderLegIntro(leg); return; }
  if(state.stage === "quiz"){ renderQuiz(leg); return; }
  if(state.stage === "unlocked"){ renderUnlocked(leg); return; }
}

function renderBrief(){
  var suspectsHtml = CASE.suspects.map(function(s){
    return '<li><strong>' + escapeHtml(s.name) + '</strong> \u2014 ' + escapeHtml(s.role) +
      '<br><span class="note">' + escapeHtml(s.note) + '</span></li>';
  }).join("");
  app.innerHTML =
    '<section class="card">' +
      '<p class="voice">' + escapeHtml(CASE.detective_intro) + '</p>' +
      '<p class="voice">' + escapeHtml(CASE.client_brief) + '</p>' +
    '</section>' +
    '<section class="card">' +
      '<h2>The suspects</h2>' +
      '<ul class="suspects">' + suspectsHtml + '</ul>' +
    '</section>' +
    '<div class="actions"><button type="button" data-action="begin">Begin the walk</button></div>';
}

function renderLegIntro(leg){
  app.innerHTML =
    '<section class="card">' +
      '<p class="stopnum">Leg ' + leg.leg_number + ' of ' + LEGS.length + '</p>' +
      '<p class="voice">' + escapeHtml(leg.intro) + '</p>' +
    '</section>' +
    '<div class="actions"><button type="button" data-action="start-quiz">Read the questions</button></div>';
}

function renderQuiz(leg){
  var legIdx = state.leg;
  var solvedArr = state.solved[legIdx];
  var currentIdx = solvedArr.findIndex(function(v){ return !v; });
  if(currentIdx === -1){
    state.stage = "unlocked";
    saveState();
    renderUnlocked(leg);
    return;
  }
  var listHtml = leg.challenges.map(function(ch, i){
    var isSolved = solvedArr[i];
    var isCurrent = i === currentIdx;
    if(i > currentIdx) return "";
    return '<div class="challenge-row' + (isSolved ? ' solved' : '') + '">' +
      '<span class="mark" aria-hidden="true">' + (isSolved ? "\u2713" : (i+1)) + '</span>' +
      '<span>' + (isSolved ? "Question " + (i+1) + " solved" : (isCurrent ? "Question " + (i+1) + " of " + leg.challenges.length : "")) + '</span>' +
    '</div>';
  }).join("");

  var ch = leg.challenges[currentIdx];
  var key = legIdx + "-" + currentIdx;
  var fb = feedback[key];
  var fbHtml = "";
  if(fb){
    fbHtml = '<div class="feedback ' + fb.type + '" role="status">' + escapeHtml(fb.text) + '</div>';
  }

  app.innerHTML =
    '<div class="challenge-list">' + listHtml + '</div>' +
    '<section class="card">' +
      '<p class="stopnum">Leg ' + leg.leg_number + ' \u00b7 Question ' + (currentIdx+1) + ' of ' + leg.challenges.length + '</p>' +
      '<p class="voice">' + escapeHtml(ch.prompt) + '</p>' +
      '<form class="challenge-form" data-action="submit-answer" data-leg="' + legIdx + '" data-ch="' + currentIdx + '">' +
        '<label for="answerInput">Your answer</label>' +
        '<div class="field-row">' +
          '<input type="text" id="answerInput" name="answer" autocomplete="off" autocapitalize="off" spellcheck="false" required>' +
          '<button type="submit">Submit</button>' +
        '</div>' +
      '</form>' +
      fbHtml +
    '</section>';

  var inputEl = document.getElementById("answerInput");
  if(inputEl) inputEl.focus();
}

function renderUnlocked(leg){
  var legIdx = state.leg;
  var dest = leg.destination;
  var arrived = state.arrived[legIdx];

  var arrivalBlockHtml;
  if(arrived){
    arrivalBlockHtml =
      '<div class="feedback correct" role="status">' + escapeHtml(dest.arrival_message) + '</div>' +
      '<div class="actions"><button type="button" data-action="continue-leg">' +
        (legIdx < LEGS.length - 1 ? "Continue to the next leg" : "Close the case") +
      '</button></div>';
  }else{
    var gs = geoStatus[legIdx];
    var showCode = !!codeVisible[legIdx] || gs === "denied" || gs === "far" || gs === "error";
    var statusHtml = "";
    if(gs === "checking") statusHtml = '<p class="status-msg">Checking your location&hellip;</p>';
    if(gs === "denied") statusHtml = '<p class="status-msg">Location wasn\u2019t available. Try the code word below.</p>';
    if(gs === "far") statusHtml = '<p class="status-msg">Not quite there yet, or too far to confirm. Try the code word below.</p>';
    if(gs === "error") statusHtml = '<p class="status-msg">Couldn\u2019t confirm your location. Try the code word below.</p>';

    var codeHtml = "";
    if(showCode){
      var ckey = legIdx + "-code";
      var cfb = feedback[ckey];
      codeHtml =
        '<form class="challenge-form" data-action="submit-code" data-leg="' + legIdx + '" style="margin-top:14px;">' +
          '<label for="codeInput">Code word</label>' +
          '<p class="quiet">' + escapeHtml(dest.confirmation_hint) + '</p>' +
          '<div class="field-row">' +
            '<input type="text" id="codeInput" name="code" autocomplete="off" autocapitalize="off" spellcheck="false" required>' +
            '<button type="submit">Confirm</button>' +
          '</div>' +
        '</form>' +
        (cfb ? '<div class="feedback ' + cfb.type + '" role="status">' + escapeHtml(cfb.text) + '</div>' : "");
    }else{
      codeHtml = '<div class="toggle-code"><button type="button" class="link-btn" data-action="show-code" data-leg="' + legIdx + '">Prefer to type a code word instead?</button></div>';
    }

    arrivalBlockHtml =
      '<p class="voice">' + escapeHtml(dest.arrival_nudge) + '</p>' +
      '<div class="actions"><button type="button" data-action="check-location" data-leg="' + legIdx + '">Check my location</button></div>' +
      statusHtml + codeHtml;
  }

  app.innerHTML =
    '<section class="card">' +
      '<p class="voice">' + escapeHtml(leg.outro) + '</p>' +
      '<p class="voice">' + escapeHtml(leg.unlock_reveal) + '</p>' +
    '</section>' +
    '<section class="card destination">' +
      '<h2>' + escapeHtml(dest.business_name) + '</h2>' +
      '<dl>' +
        '<dt>Address</dt><dd>' + escapeHtml(dest.address) + '</dd>' +
        '<dt>Hours</dt><dd>' + escapeHtml(dest.hours) + '</dd>' +
      '</dl>' +
      '<a class="btn" href="' + escapeAttr(dest.maps_link) + '" target="_blank" rel="noopener">Open in Maps</a>' +
    '</section>' +
    '<section class="card">' + arrivalBlockHtml + '</section>';
}

function renderFinal(){
  app.innerHTML =
    '<section class="card">' +
      '<p class="voice">' + escapeHtml(CASE.final_congrats) + '</p>' +
    '</section>' +
    '<div class="final-seal-wrap">' +
      '<svg viewBox="0 0 100 100" width="90" height="90" aria-hidden="true">' +
        '<circle cx="50" cy="50" r="45" fill="var(--oxblood)" stroke="var(--brass)" stroke-width="3"></circle>' +
        '<text x="50" y="59" text-anchor="middle" font-family="Special Elite, monospace" font-size="30" fill="var(--paper)">CW</text>' +
        '<path class="crack active" d="M50 8 L46 30 L57 41 L44 57"></path>' +
        '<path class="crack active" d="M92 50 L68 46 L59 58 L69 75"></path>' +
        '<path class="crack active" d="M50 92 L54 70 L40 59 L48 43"></path>' +
      '</svg>' +
    '</div>' +
    '<footer class="bottom"><a href="https://casewalk.city">Back to casewalk.city</a></footer>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

// ---------- answer checking ----------
function checkChallenge(legIdx, chIdx, rawInput){
  var key = legIdx + "-" + chIdx;
  var now = Date.now();
  if(lastSubmitAt[key] && (now - lastSubmitAt[key]) < 2000){
    return; // light rate limit, ignore silently-ish
  }
  lastSubmitAt[key] = now;

  var ch = LEGS[legIdx].challenges[chIdx];
  var norm = normalize(rawInput);
  var validAnswers = [ch.answer].concat(ch.accepted_variants || []).map(normalize);

  if(validAnswers.indexOf(norm) !== -1){
    state.solved[legIdx][chIdx] = true;
    delete feedback[key];
    saveState();
    render();
    return;
  }

  var nearMisses = ch.near_misses || {};
  var nmKeys = Object.keys(nearMisses);
  for(var i=0;i<nmKeys.length;i++){
    if(normalize(nmKeys[i]) === norm){
      feedback[key] = { type: "nudge", text: nearMisses[nmKeys[i]] };
      render();
      return;
    }
  }

  state.attempts[legIdx][chIdx] = (state.attempts[legIdx][chIdx] || 0) + 1;
  var attempts = state.attempts[legIdx][chIdx];
  if(attempts >= ch.reveal_after_attempts){
    state.solved[legIdx][chIdx] = true;
    feedback[key] = { type: "reveal", text: "In the interest of the case, I'll tell you plain: the answer was " + ch.answer.toUpperCase() + "." };
    saveState();
    render();
    return;
  }
  var tier = Math.min(attempts - 1, ch.hint_ladder.length - 1);
  feedback[key] = { type: "hint", text: ch.hint_ladder[tier] };
  saveState();
  render();
}

function checkCode(legIdx, rawInput){
  var dest = LEGS[legIdx].destination;
  var key = legIdx + "-code";
  var norm = normalize(rawInput);
  if(norm === normalize(dest.confirmation_code_word)){
    state.arrived[legIdx] = true;
    delete feedback[key];
    delete geoStatus[legIdx];
    saveState();
    logPing(dest.location_id, dest.business_name, "codeword");
    render();
  }else{
    feedback[key] = { type: "hint", text: "That's not quite it. " + dest.confirmation_hint };
    render();
  }
}

function checkLocation(legIdx){
  var dest = LEGS[legIdx].destination;
  if(!("geolocation" in navigator)){
    geoStatus[legIdx] = "denied";
    codeVisible[legIdx] = true;
    render();
    return;
  }
  geoStatus[legIdx] = "checking";
  render();
  navigator.geolocation.getCurrentPosition(function(pos){
    var d = haversineMeters(pos.coords.latitude, pos.coords.longitude, dest.lat, dest.lng);
    if(d <= dest.geofence_radius_m){
      state.arrived[legIdx] = true;
      delete geoStatus[legIdx];
      saveState();
      logPing(dest.location_id, dest.business_name, "gps");
      render();
    }else{
      geoStatus[legIdx] = "far";
      codeVisible[legIdx] = true;
      render();
    }
  }, function(err){
    geoStatus[legIdx] = "error";
    codeVisible[legIdx] = true;
    render();
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

// ---------- event delegation ----------
document.body.addEventListener("click", function(e){
  var actEl = e.target.closest("[data-action]");
  if(!actEl) return;
  var action = actEl.getAttribute("data-action");
  if(action === "begin"){
    state.screen = "play"; state.leg = 0; state.stage = "intro";
    saveState(); render();
  }else if(action === "start-quiz"){
    state.stage = "quiz"; saveState(); render();
  }else if(action === "continue-leg"){
    var legIdx = state.leg;
    geoStatus[legIdx] = null; codeVisible[legIdx] = false;
    if(legIdx < LEGS.length - 1){
      state.leg = legIdx + 1; state.stage = "intro";
    }else{
      state.screen = "final";
    }
    saveState(); render();
  }else if(action === "check-location"){
    checkLocation(parseInt(actEl.getAttribute("data-leg"), 10));
  }else if(action === "show-code"){
    codeVisible[parseInt(actEl.getAttribute("data-leg"), 10)] = true;
    render();
  }
});

document.body.addEventListener("submit", function(e){
  var formEl = e.target.closest("[data-action]");
  if(!formEl) return;
  e.preventDefault();
  var action = formEl.getAttribute("data-action");
  if(action === "submit-answer"){
    var legIdx = parseInt(formEl.getAttribute("data-leg"), 10);
    var chIdx = parseInt(formEl.getAttribute("data-ch"), 10);
    var val = formEl.querySelector("input[name=answer]").value;
    checkChallenge(legIdx, chIdx, val);
  }else if(action === "submit-code"){
    var lIdx = parseInt(formEl.getAttribute("data-leg"), 10);
    var cval = formEl.querySelector("input[name=code]").value;
    checkCode(lIdx, cval);
  }
});

document.getElementById("startOverBtn").addEventListener("click", function(){
  if(window.confirm("Start this case over from the beginning?")){
    state = freshState();
    feedback = {}; lastSubmitAt = {}; geoStatus = {}; codeVisible = {};
    saveState();
    render();
  }
});

render();
})();
</script>
